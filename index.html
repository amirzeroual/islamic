<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Mouslim Pro - Palamós</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --accent: #10b981;
            --gold: #fbbf24;
            --text: #f1f5f9;
            --btn-grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --glow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* Lang Switcher - Professional Styles */
        .header {
            padding: 25px;
            text-align: center;
            background: linear-gradient(180deg, rgba(16,185,129,0.1) 0%, transparent 100%);
        }

        .lang-control {
            display: inline-flex;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .lang-control button {
            padding: 8px 22px;
            border: none;
            border-radius: 15px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 700;
        }

        .lang-control button.active {
            background: var(--btn-grad);
            color: white;
            box-shadow: var(--glow);
        }

        /* Navigation */
        nav { display: flex; padding: 0 20px 20px; gap: 10px; }
        nav button {
            flex: 1; padding: 15px 5px; border: none; border-radius: 20px;
            background: rgba(255,255,255,0.03); color: #64748b; font-weight: 600;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        nav button.active { color: var(--accent); background: rgba(16,185,129,0.1); border: 1px solid var(--accent); }

        /* Content Sections */
        .content { padding: 0 25px 30px; flex-grow: 1; }
        .view { display: none; animation: slideUp 0.5s ease; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Prayer Item Style */
        .p-row {
            background: rgba(255,255,255,0.03);
            padding: 22px;
            border-radius: 25px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .p-row.next { 
            border: 2px solid var(--accent); 
            background: rgba(16, 185, 129, 0.08);
            box-shadow: var(--glow);
        }

        /* Dhikr Master System */
        .cat-btn {
            background: var(--btn-grad);
            padding: 22px;
            border-radius: 22px;
            margin-bottom: 15px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dhikr-interface { display: none; text-align: center; }
        .dhikr-text {
            background: #fff; color: #0f172a; padding: 35px 25px;
            border-radius: 30px; font-family: 'Amiri', serif; font-size: 1.6rem;
            line-height: 2; margin: 25px 0; direction: rtl;
        }

        .sebha-btn {
            width: 130px; height: 130px; border-radius: 50%;
            background: var(--btn-grad); margin: 20px auto;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
            border: 5px solid rgba(255,255,255,0.2);
        }
        .sebha-btn:active { transform: scale(0.92); }

        /* Quran Controls */
        .q-ui select {
            width: 100%; padding: 18px; background: #1e293b; border: 1px solid #334155;
            color: white; border-radius: 18px; margin-bottom: 15px; outline: none;
        }

        [dir="rtl"] { text-align: right; }
        [dir="rtl"] .p-row { flex-direction: row-reverse; }
    </style>
</head>
<body dir="ltr">

<div class="app-wrapper">
    <div class="header">
        <div class="lang-control">
            <button id="lang-fr" class="active" onclick="setAppLang('fr')">FR</button>
            <button id="lang-ar" onclick="setAppLang('ar')">AR</button>
        </div>
        <h1 id="ui-city" style="font-size: 1.4rem; letter-spacing: 1px;">Palamós, Spain</h1>
        <p id="ui-hijri" style="color: var(--gold); font-weight: 700; margin-top: 8px;">Calcul en cours...</p>
    </div>

    <nav>
        <button onclick="navTo('v-p', this)" class="active">
            <i class="fas fa-history"></i> <span id="ui-nav-p">Prières</span>
        </button>
        <button onclick="navTo('v-q', this)">
            <i class="fas fa-star-and-crescent"></i> <span id="ui-nav-q">Coran</span>
        </button>
        <button onclick="navTo('v-a', this)">
            <i class="fas fa-fingerprint"></i> <span id="ui-nav-a">Adkar</span>
        </button>
    </nav>

    <div class="content">
        <div id="v-p" class="view active">
            <div id="prayer-display"></div>
        </div>

        <div id="v-q" class="view">
            <div class="q-ui">
                <select id="reciter-in" class="q-select">
                    <option value="7">Cheikh Al-Soudais</option>
                    <option value="12">Yasser Al-Dosari</option>
                </select>
                <select id="surah-in" class="q-select"></select>
                <button class="sebha-btn" style="width:100%; border-radius:15px; height:60px;" onclick="playSelectedQuran()" id="ui-play-btn">
                    ÉCOUTER
                </button>
                <audio id="audio-player" controls style="width: 100%; margin-top: 25px; filter: invert(1);"></audio>
            </div>
        </div>

        <div id="v-a" class="view">
            <div id="adkar-list-menu">
                <div class="cat-btn" onclick="openDhikr('m')"><span id="ui-m">Matin</span> <i class="fas fa-sun"></i></div>
                <div class="cat-btn" onclick="openDhikr('e')"><span id="ui-e">Soir</span> <i class="fas fa-moon"></i></div>
                <div class="cat-btn" onclick="openDhikr('s')"><span id="ui-s">Sommeil</span> <i class="fas fa-bed"></i></div>
            </div>

            <div id="dhikr-view" class="dhikr-interface">
                <button onclick="exitDhikr()" style="background:none; border:none; color:#ef4444; float:left; font-size:1.5rem;"><i class="fas fa-times-circle"></i></button>
                <div class="dhikr-text" id="active-dhikr-text">...</div>
                <div class="sebha-btn" onclick="sebhaClick()">
                    <span style="font-size: 2.2rem; font-weight: 700;" id="sebha-count">0</span>
                    <span style="font-size: 0.8rem; opacity: 0.7;" id="sebha-goal">/ 3</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- DATABASE & TRANSLATIONS ---
    const i18n = {
        fr: { city: "Palamós, Espagne", nav: ["Prières", "Coran", "Adkar"], play: "ÉCOUTER MAINTENANT", cats: ["Matin", "Soir", "Sommeil"] },
        ar: { city: "بالاموس، إسبانيا", nav: ["الصلاة", "القرآن", "الأذكار"], play: "استمع الآن", cats: ["أذكار الصباح", "أذكار المساء", "أذكار النوم"] }
    };

    const ADKAR_DATA = {
        m: [
            { t: "أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له", g: 1 },
            { t: "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين", g: 3 },
            { t: "سبحان الله وبحمده: عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته", g: 3 },
            { t: "اللهم بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت، وإليك النشور", g: 1 }
        ],
        e: [
            { t: "أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له", g: 1 },
            { t: "أعوذ بكلمات الله التامات من شر ما خلق", g: 3 },
            { t: "اللهم ما أمسى بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك", g: 1 }
        ],
        s: [
            { t: "باسمك ربي وضعت جنبي، وبك أرفعه، فإن أمسكت نفسي فارحمها", g: 1 },
            { t: "اللهم قني عذابك يوم تبعث عبادك", g: 3 },
            { t: "باسمك اللهم أموت وأحيا", g: 1 }
        ]
    };

    let currentLang = 'fr';
    let currentDIndex = 0;
    let currentDType = '';
    let clickCount = 0;

    // --- CORE AUTOMATION ---
    async function startApp() {
        await refreshPrayerTimes();
        await loadQuranChapters();
        // Mise à jour automatique toutes les minutes
        setInterval(refreshPrayerTimes, 60000);
    }

    async function refreshPrayerTimes() {
        const date = new Date();
        const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${date.getDate()}-${date.getMonth()+1}-${date.getFullYear()}?city=Palamos&country=Spain&method=3`);
        const data = await res.json();
        
        const timings = data.data.timings;
        const hijri = data.data.date.hijri;
        
        // Affichage Date Hijri automatique
        document.getElementById('ui-hijri').innerText = (currentLang === 'ar') 
            ? `${hijri.day} ${hijri.month.ar} ${hijri.year} هـ`
            : `${hijri.day} ${hijri.month.en} ${hijri.year} AH`;

        renderPrayers(timings);
    }

    function renderPrayers(t) {
        const list = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
        const arNames = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء" };
        
        const now = new Date();
        const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();
        
        let html = '';
        let foundNext = false;

        list.forEach(name => {
            const [h, m] = t[name].split(':');
            const prayerMinutes = parseInt(h) * 60 + parseInt(m);
            const isNext = !foundNext && prayerMinutes > currentTotalMinutes;
            if(isNext) foundNext = true;

            const label = (currentLang === 'ar') ? arNames[name] : name;

            html += `
                <div class="p-row ${isNext ? 'next' : ''}">
                    <span style="font-weight:700; font-size:1.1rem;">${label}</span>
                    <span style="color:var(--accent); font-weight:bold; font-size:1.2rem;">${t[name]}</span>
                </div>`;
        });
        document.getElementById('prayer-display').innerHTML = html;
    }

    // --- LOGIC UI ---
    function setAppLang(l) {
        currentLang = l;
        document.body.dir = (l === 'ar') ? 'rtl' : 'ltr';
        document.getElementById('lang-fr').classList.toggle('active', l === 'fr');
        document.getElementById('lang-ar').classList.toggle('active', l === 'ar');
        
        const d = i18n[l];
        document.getElementById('ui-city').innerText = d.city;
        document.getElementById('ui-nav-p').innerText = d.nav[0];
        document.getElementById('ui-nav-q').innerText = d.nav[1];
        document.getElementById('ui-nav-a').innerText = d.nav[2];
        document.getElementById('ui-play-btn').innerText = d.play;
        document.getElementById('ui-m').innerText = d.cats[0];
        document.getElementById('ui-e').innerText = d.cats[1];
        document.getElementById('ui-s').innerText = d.cats[2];
        
        refreshPrayerTimes();
    }

    function navTo(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    // --- QURAN MASTER ---
    async function loadQuranChapters() {
        const res = await fetch('https://api.quran.com/api/v4/chapters');
        const data = await res.json();
        let h = '';
        data.chapters.forEach(s => h += `<option value="${s.id}">${s.id}. ${s.name_simple} (${s.name_arabic})</option>`);
        document.getElementById('surah-in').innerHTML = h;
    }

    async function playSelectedQuran() {
        const r = document.getElementById('reciter-in').value;
        const s = document.getElementById('surah-in').value;
        const res = await fetch(`https://api.quran.com/api/v4/chapter_recitations/${r}/${s}`);
        const d = await res.json();
        const audio = document.getElementById('audio-player');
        audio.src = d.audio_file.audio_url;
        audio.play();
    }

    // --- ADKAR MASTER ---
    function openDhikr(type) {
        currentDType = type; currentDIndex = 0; clickCount = 0;
        document.getElementById('adkar-list-menu').style.display = 'none';
        document.getElementById('dhikr-view').style.display = 'block';
        updateDhikrDisplay();
    }

    function exitDhikr() {
        document.getElementById('adkar-list-menu').style.display = 'block';
        document.getElementById('dhikr-view').style.display = 'none';
    }

    function sebhaClick() {
        const item = ADKAR_DATA[currentDType][currentDIndex];
        clickCount++;
        if (clickCount >= item.g) {
            clickCount = 0;
            currentDIndex++;
            if (currentDIndex >= ADKAR_DATA[currentDType].length) {
                alert(currentLang === 'ar' ? "تم بحمد الله" : "Terminé avec succès !");
                exitDhikr(); return;
            }
        }
        if(navigator.vibrate) navigator.vibrate(50);
        updateDhikrDisplay();
    }

    function updateDhikrDisplay() {
        const item = ADKAR_DATA[currentDType][currentDIndex];
        document.getElementById('active-dhikr-text').innerText = item.t;
        document.getElementById('sebha-count').innerText = clickCount;
        document.getElementById('sebha-goal').innerText = "/ " + item.g;
    }

    startApp();
</script>
</body>
</html>
