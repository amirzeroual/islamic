<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المسلم Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --accent: #10b981;
            --gold: #fbbf24;
            --text: #f1f5f9;
            --btn-grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.4s ease; }

        body {
            font-family: 'Poppins', 'Amiri', serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        .header {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(16,185,129,0.15) 0%, transparent 100%);
        }

        .location-tag { font-size: 1.6rem; font-weight: 700; color: var(--text); }
        .hijri-date { color: var(--gold); font-family: 'Amiri'; font-size: 1.2rem; margin-top: 5px; }

        nav { display: flex; padding: 10px 20px; gap: 10px; }
        nav button {
            flex: 1; padding: 15px; border-radius: 20px; border: none;
            background: rgba(255,255,255,0.03); color: #64748b;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        nav button.active { background: rgba(16,185,129,0.1); color: var(--accent); border: 1px solid var(--accent); }

        .content { padding: 20px 25px 30px; flex-grow: 1; position: relative; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Horaires */
        .prayer-card {
            background: rgba(255,255,255,0.03);
            padding: 22px;
            border-radius: 25px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .prayer-card.next { border: 2px solid var(--accent); background: rgba(16,185,129,0.1); box-shadow: 0 0 20px rgba(16,185,129,0.2); }

        /* Adkar Master UI */
        .adkar-cat {
            background: var(--btn-grad); padding: 22px; border-radius: 22px;
            margin-bottom: 15px; cursor: pointer; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center;
        }

        .dhikr-player { display: none; text-align: center; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card); z-index: 10; padding: 20px; }
        .dhikr-display {
            background: #fff; color: #0f172a; padding: 40px 20px;
            border-radius: 30px; font-family: 'Amiri', serif; font-size: 1.6rem;
            line-height: 2; margin: 25px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .sebha-btn {
            width: 140px; height: 140px; border-radius: 50%;
            background: var(--btn-grad); margin: 20px auto;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
            border: 6px solid rgba(255,255,255,0.1);
        }
        .sebha-btn:active { transform: scale(0.9); }

        /* Quran */
        .q-select { width: 100%; padding: 18px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 15px; margin-bottom: 15px; font-family: 'Amiri'; }
        .play-master-btn { width: 100%; padding: 20px; background: var(--btn-grad); border: none; border-radius: 20px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="location-tag">Palamós</div>
        <div class="hijri-date" id="hijri-txt">9 رمضان 1447 هـ</div>
    </div>

    <nav>
        <button onclick="switchView('v-p', this)" class="active">
            <i class="fas fa-mosque"></i> <span>الصلاة</span>
        </button>
        <button onclick="switchView('v-q', this)">
            <i class="fas fa-book-quran"></i> <span>القرآن</span>
        </button>
        <button onclick="switchView('v-a', this)">
            <i class="fas fa-beads"></i> <span>الأذكار</span>
        </button>
    </nav>

    <div class="content">
        <div id="v-p" class="view active">
            <div id="prayer-list"></div>
        </div>

        <div id="v-q" class="view">
            <select id="reciter" class="q-select">
                <option value="7">عبد الرحمن السديس (الرسمي)</option>
                <option value="12">ياسر الدوسري (الرسمي)</option>
            </select>
            <select id="surah" class="q-select"></select>
            <button class="play-master-btn" onclick="playQuran()">استماع الآن</button>
            <audio id="main-player" controls style="width: 100%; margin-top: 20px; filter: invert(1);"></audio>
        </div>

        <div id="v-a" class="view">
            <div id="adkar-menu">
                <div class="adkar-cat" onclick="startDhikr('m')"><span>أذكار الصباح</span> <i class="fas fa-sun"></i></div>
                <div class="adkar-cat" onclick="startDhikr('e')"><span>أذكار المساء</span> <i class="fas fa-moon"></i></div>
                <div class="adkar-cat" onclick="startDhikr('s')"><span>أذكار النوم</span> <i class="fas fa-bed"></i></div>
            </div>

            <div id="dhikr-ui" class="dhikr-player">
                <div style="text-align: left;"><i class="fas fa-times-circle" onclick="stopDhikr()" style="cursor:pointer; font-size: 1.5rem; color: #ef4444;"></i></div>
                <div class="dhikr-display" id="dhikr-txt">...</div>
                <div class="sebha-btn" onclick="countDhikr()">
                    <span style="font-size: 2.8rem; font-weight: 700;" id="s-val">0</span>
                    <span style="font-size: 0.9rem; opacity: 0.8;" id="s-goal">/ 3</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const ADKAR_DB = {
        m: [
            { t: "أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له", g: 1 },
            { t: "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين", g: 3 },
            { t: "سبحان الله وبحمده: عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته", g: 3 }
        ],
        e: [
            { t: "أمسينا وأمسى الملك لله، والحمد لله", g: 1 },
            { t: "أعوذ بكلمات الله التامات من شر ما خلق", g: 3 },
            { t: "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله", g: 3 }
        ],
        s: [
            { t: "باسمك ربي وضعت جنبي وبك أرفعه", g: 1 },
            { t: "اللهم قني عذابك يوم تبعث عبادك", g: 3 }
        ]
    };

    let dType = ''; let dIdx = 0; let dCount = 0;

    async function init() {
        await fetchPrayers();
        await fetchSurahs();
        setInterval(fetchPrayers, 60000);
    }

    async function fetchPrayers() {
        const d = new Date();
        const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=Palamos&country=Spain&method=3`);
        const data = await res.json();
        const t = data.data.timings;
        const list = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
        const names = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء" };
       
        const now = new Date();
        const nowM = now.getHours() * 60 + now.getMinutes();
        let html = ''; let found = false;

        list.forEach(n => {
            const [h, m] = t[n].split(':');
            const pM = parseInt(h) * 60 + parseInt(m);
            const isNext = !found && pM > nowM;
            if(isNext) found = true;

            html += `<div class="prayer-card ${isNext ? 'next' : ''}">
                <span style="font-weight:700">${names[n]}</span>
                <span style="color:var(--accent); font-weight:bold; font-size:1.3rem;">${t[n]}</span>
            </div>`;
        });
        document.getElementById('prayer-list').innerHTML = html;
    }

    async function fetchSurahs() {
        const res = await fetch('https://api.quran.com/api/v4/chapters');
        const data = await res.json();
        let h = '';
        data.chapters.forEach(s => h += `<option value="${s.id}">${s.id}. ${s.name_arabic}</option>`);
        document.getElementById('surah').innerHTML = h;
    }

    async function playQuran() {
        const r = document.getElementById('reciter').value;
        const s = document.getElementById('surah').value;
        const res = await fetch(`https://api.quran.com/api/v4/chapter_recitations/${r}/${s}`);
        const d = await res.json();
        const player = document.getElementById('main-player');
        player.src = d.audio_file.audio_url;
        player.play();
    }

    function switchView(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if(id !== 'v-a') stopDhikr();
    }

    function startDhikr(type) {
        dType = type; dIdx = 0; dCount = 0;
        document.getElementById('dhikr-ui').style.display = 'block';
        updateDUI();
    }

    function stopDhikr() {
        document.getElementById('dhikr-ui').style.display = 'none';
    }

    function countDhikr() {
        const item = ADKAR_DB[dType][dIdx];
        dCount++;
       
        if (dCount >= item.g) {
            dCount = 0;
            dIdx++;
            // Automatisation : si fini, on ferme sans alert
            if (dIdx >= ADKAR_DB[dType].length) {
                setTimeout(stopDhikr, 300); // Petit délai pour voir le dernier chiffre
                return;
            }
        }
        if(navigator.vibrate) navigator.vibrate(40);
        updateDUI();
    }

    function updateDUI() {
        const item = ADKAR_DB[dType][dIdx];
        document.getElementById('dhikr-txt').innerText = item.t;
        document.getElementById('s-val').innerText = dCount;
        document.getElementById('s-goal').innerText = "/ " + item.g;
    }

    init();
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
<link rel="manifest" href="manifest.json">
</body>
</html>
