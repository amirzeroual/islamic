<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Mouslim Pro</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --accent: #10b981;
            --gold: #fbbf24;
            --text: #f1f5f9;
            --btn-grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: 0.3s ease; }

        body {
            font-family: 'Poppins', 'Amiri', serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            overflow: hidden;
            position: relative;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(16,185,129,0.15) 0%, transparent 100%);
        }

        .location-tag { font-size: 1.8rem; font-weight: 700; color: #fff; }
        .hijri-date { color: var(--gold); font-family: 'Amiri'; font-size: 1.2rem; margin-top: 5px; }

        #install-btn {
            display: none; background: var(--gold); color: #000; border: none;
            padding: 8px 15px; border-radius: 12px; font-weight: 700; font-size: 0.9rem;
            margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        nav { display: flex; padding: 10px 15px; gap: 8px; background: rgba(0,0,0,0.2); }
        nav button {
            flex: 1; padding: 12px; border-radius: 18px; border: none;
            background: transparent; color: #64748b;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;
            font-size: 0.85rem;
        }
        nav button.active { background: rgba(16,185,129,0.1); color: var(--accent); border: 1px solid var(--accent); }

        .content { padding: 20px; flex-grow: 1; overflow-y: auto; position: relative; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        .prayer-card {
            background: rgba(255,255,255,0.03); padding: 22px; border-radius: 25px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .prayer-card.highlight { border: 2px solid var(--accent); background: rgba(16, 185, 129, 0.1); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }

        .list-item { background: rgba(255,255,255,0.03); padding: 18px; border-radius: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }

        .player-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--card); z-index: 1000; padding: 25px; text-align: center; }
        .dhikr-box { background: #fff; color: #0f172a; padding: 30px 20px; border-radius: 30px; font-family: 'Amiri', serif; font-size: 1.6rem; line-height: 2; margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3); min-height: 180px; display: flex; align-items: center; justify-content: center; }
        .sebha-btn { width: 140px; height: 140px; border-radius: 50%; background: var(--btn-grad); margin: 20px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border: 8px solid rgba(255,255,255,0.1); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4); }

        .app-footer {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }

        .quote-box {
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.05), transparent);
            padding: 10px; border-radius: 10px;
        }

        .quote-text { font-family: 'Amiri', serif; font-size: 1.1rem; color: var(--gold); display: block; margin-bottom: 5px; }
        .quote-ref { font-size: 0.7rem; color: var(--accent); font-weight: bold; opacity: 0.8; }
        
        .play-q-btn {
            width: 100%; padding: 20px; border-radius: 20px; border: none; 
            background: var(--btn-grad); color: white; font-weight: bold; 
            cursor: pointer; position: relative; z-index: 10;
        }
    </style>
</head>
<body onclick="unlockAudio()">

<div class="app-container">
    <audio id="adhan-audio" src="https://www.islamcan.com/audio/adhan/azan1.mp3" preload="auto"></audio>
    <audio id="quran-audio" preload="auto"></audio>

    <div class="header">
        <button id="install-btn" onclick="installApp()"><i class="fas fa-download"></i> تثبيت التطبيق</button>
        <div class="location-tag">Palamós</div>
        <div id="hijri-txt" class="hijri-date">...</div>
    </div>

    <nav>
        <button onclick="switchTab('v-p', this)" class="active"><i class="fas fa-clock"></i><span>الصلاة</span></button>
        <button onclick="switchTab('v-q', this)"><i class="fas fa-quran"></i><span>القرآن</span></button>
        <button onclick="switchTab('v-a', this)"><i class="fas fa-hands-praying"></i><span>أذكار</span></button>
        <button onclick="switchTab('v-d', this)"><i class="fas fa-heart"></i><span>أدعية</span></button>
    </nav>

    <div class="content">
        <div id="v-p" class="view active"><div id="prayer-list"></div></div>
        
        <div id="v-q" class="view">
            <select id="reciter" style="width:100%; padding:15px; background:#1e293b; color:#fff; border-radius:15px; margin-bottom:10px; border:none; position:relative; z-index:10;">
                <option value="12">ياسر الدوسري</option>
                <option value="7">عبد الرحمن السديس</option>
            </select>
            <select id="surah" style="width:100%; padding:15px; background:#1e293b; color:#fff; border-radius:15px; margin-bottom:15px; border:none; position:relative; z-index:10;"></select>
            <button class="play-q-btn" onclick="playQuran()">
                <i class="fas fa-play-circle"></i> تشغيل القراءة
            </button>
        </div>

        <div id="v-a" class="view">
            <div class="list-item" onclick="startDhikr('m')"><span>أذكار الصباح</span><i class="fas fa-sun"></i></div>
            <div class="list-item" onclick="startDhikr('e')"><span>أذكار المساء</span><i class="fas fa-moon"></i></div>
        </div>

        <div id="v-d" class="view"><div id="douae-list"></div></div>

        <div id="player-ui" class="player-overlay">
            <div style="text-align: left;"><i class="fas fa-times-circle" onclick="closePlayer()" style="font-size:2rem; color:#ff4d4d; cursor:pointer"></i></div>
            <div id="dhikr-text" class="dhikr-box"></div>
            <div class="sebha-btn" onclick="handleCounter()">
                <span id="s-val" style="font-size: 2.5rem; font-weight: 700;">0</span>
                <span id="s-goal" style="font-size: 0.9rem; opacity: 0.7;">/ 0</span>
            </div>
        </div>
    </div>

    <div class="app-footer">
        <div class="quote-box">
            <span class="quote-text" id="daily-quote">"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا"</span>
            <span class="quote-ref" id="quote-ref">سورة الشرح</span>
        </div>
        <div style="font-size: 0.65rem; margin-top: 10px; opacity: 0.3; letter-spacing: 1px;">
            AL-MOUSLIM PRO • PALAMÓS 2026
        </div>
    </div>
</div>

<script>
    const QUOTES_LIST = [
        {t: "وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ", r: "سورة الطلاق"},
        {t: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", r: "سورة الرعد"},
        {t: "إِنَّ اللَّهَ مَعَ الصَّابِرِينَ", r: "سورة البقرة"},
        {t: "ادْعُونِي أَسْتَجِبْ لَكُمْ", r: "سورة غافر"},
        {t: "وَقُل رَّبِّ زِدْنِي عِلْمًا", r: "سورة طه"}
    ];

    let pTimes = {}; let curType = ''; let curIdx = 0; let curCnt = 0;
    const ADKAR_DB = { m: [{ t: "أصبحنا وأصبح الملك لله", g: 1 }, { t: "سبحان الله وبحمده", g: 100 }], e: [{ t: "أمسينا وأمسى الملك لله", g: 1 }] };
    const DOUAE_DB = ["اللهم إنك عفو كريم تحب العفو فاعفُ عني", "ربنا آتنا في الدنيا حسنة", "اللهم إني أسألك الهدى والتقى"];

    async function init() { 
        updateDailyQuote();
        await updateData(); 
        await loadSurahs(); 
        renderDouae(); 
        setInterval(updateData, 60000); 
    }

    function updateDailyQuote() {
        const randomQuote = QUOTES_LIST[Math.floor(Math.random() * QUOTES_LIST.length)];
        document.getElementById('daily-quote').innerText = `"${randomQuote.t}"`;
        document.getElementById('quote-ref').innerText = randomQuote.r;
    }

    async function updateData() {
        const d = new Date();
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=Palamos&country=Spain&method=3`);
            const data = await res.json();
            pTimes = data.data.timings;
            document.getElementById('hijri-txt').innerText = `${data.data.date.hijri.day} ${data.data.date.hijri.month.ar} ${data.data.date.hijri.year} هـ`;
            renderPrayers();
        } catch(e) {}
    }

    function renderPrayers() {
        const keys = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
        const names = { Fajr: "الفجر", Dhuhr: "الظهر", Asr: "العصر", Maghrib: "المغرب", Isha: "العشاء" };
        const now = new Date();
        const nowStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        let html = ''; let nextFound = false;
        keys.forEach(k => {
            const isNext = !nextFound && (pTimes[k] > nowStr);
            if(isNext) nextFound = true;
            html += `<div class="prayer-card ${isNext ? 'highlight' : ''}"><span>${names[k]}</span><span style="color:var(--accent); font-weight:bold;">${pTimes[k]}</span></div>`;
        });
        document.getElementById('prayer-list').innerHTML = html;
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    }

    async function loadSurahs() {
        const res = await fetch('https://api.quran.com/api/v4/chapters');
        const data = await res.json();
        let html = ''; data.chapters.forEach(s => html += `<option value="${s.id}">${s.id}. ${s.name_arabic}</option>`);
        document.getElementById('surah').innerHTML = html;
    }

    async function playQuran() {
        const r = document.getElementById('reciter').value; 
        const s = document.getElementById('surah').value;
        const player = document.getElementById('quran-audio');
        const btn = document.querySelector('.play-q-btn');

        try {
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';
            const res = await fetch(`https://api.quran.com/api/v4/chapter_recitations/${r}/${s}`);
            const data = await res.json();
            let audioUrl = data.audio_file.audio_url;
            
            if (!audioUrl.startsWith('http')) audioUrl = 'https:' + audioUrl;
            
            player.src = audioUrl;
            player.load();
            player.play().then(() => {
                btn.innerHTML = '<i class="fas fa-pause"></i> إيقاف';
                btn.onclick = () => { player.pause(); btn.innerHTML = '<i class="fas fa-play"></i> تشغيل'; btn.onclick = playQuran; };
            }).catch(e => {
                alert("اضغط على الشاشة أولاً لتفعيل الصوت");
                btn.innerHTML = '<i class="fas fa-play-circle"></i> تشغيل القراءة';
            });
        } catch(e) {
            btn.innerHTML = '<i class="fas fa-play-circle"></i> تشغيل القراءة';
        }
    }

    function renderDouae() {
        let html = ''; DOUAE_DB.forEach(d => { html += `<div class="list-item"><span>${d}</span><i class="fas fa-heart"></i></div>`; });
        document.getElementById('douae-list').innerHTML = html;
    }

    function startDhikr(type) { curType = type; curIdx = 0; curCnt = 0; document.getElementById('player-ui').style.display = 'block'; updateUI(); }
    function closePlayer() { document.getElementById('player-ui').style.display = 'none'; }
    function handleCounter() {
        const item = ADKAR_DB[curType][curIdx]; curCnt++;
        if (curCnt >= item.g) { curCnt = 0; curIdx++; if (curIdx >= ADKAR_DB[curType].length) { closePlayer(); return; } }
        updateUI();
    }
    function updateUI() { const item = ADKAR_DB[curType][curIdx]; document.getElementById('dhikr-text').innerText = item.t; document.getElementById('s-val').innerText = curCnt; document.getElementById('s-goal').innerText = "/ " + item.g; }
    
    let audioUnlocked = false;
    function unlockAudio() { if (audioUnlocked) return; audioUnlocked = true; }

    init();
</script>
</body>
</html>
